<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Playmash - Desenvolvedor</title>

    <link rel="stylesheet" href="dev.css">
</head>

<body>
    <header class="header">
    <div class="logo-area">
        <img id="logo" src="img logo.png" alt="Logo Playmash">
    </div>
   
    <nav class="menu" id="menu1">
        <button class="icon-button" aria-label="Biblioteca">
            <img id="biblioteca" src="istockphoto-2157188840-612x612-removebg-preview.png" alt="biblioteca de jogos">
        </button>

        <button class="icon-button" aria-label="Carrinho de compras">
            <img id="carrinho"  src="carrinho.png" alt="carrinho de compras">
            
        </button>

        <button class="icon-button" id="perfilBtn" type="button" aria-label="Perfil">
            <img id="perfil" src="Captura_de_tela_2026-09-28_142303-removebg-preview.png" alt="Perfil">
        </button>
    </nav>
</header>


    <main>

        <section class="painel">

            <div class="titulo">
                <h2>Editar o jogo</h2>
            </div>

            <nav class="menu">

                <button type="button" class="menu-item ativo">
                    Descrição
                </button>

                <button type="button" class="menu-item">
                    Código
                </button>

                <button type="button" class="menu-item">
                    Preço
                </button>

            </nav>


            <form id="formJogo">

                <div class="conteudo">

                    <div class="formulario">

                        <div class="campo">
                            <input
                                type="text"
                                id="nome"
                                placeholder="Nome do jogo"
                                required
                            >
                        </div>


                        <div class="campo">
                            <textarea
                                id="descricao"
                                placeholder="Descrição..."
                                required
                            ></textarea>
                        </div>


                        <div class="campo">
                            <input
                                type="number"
                                id="preco"
                                placeholder="Preço"
                                min="0"
                                step="0.01"
                                required
                            >
                        </div>

                        <div class="campo">
                            <input
                                type="text"
                                id="tecnologia"
                                placeholder="Tecnologia / Plataforma"
                                required
                            >
                        </div>
                        <div class="campo">
                            <input
                                type="text"
                                id="codigo"
                                placeholder="Código do jogo"
                                required
                            >
                        </div>

                    </div>

                    <div class="lado-direito">

                        <div class="imagem-container">

                            <img
                                id="previewImagem"
                                src="https://placehold.co/500x300/222/fff?text=Imagem+do+Jogo"
                                alt="Imagem do jogo"
                            >

                        </div>


                        <label class="upload">

                            <span>Escolher imagem</span>

                            <input
                                type="file"
                                id="imagem"
                                accept="image/*"
                            >

                        </label>

                        <button
                            type="submit"
                            class="botao-enviar"
                        >
                            Enviar para avaliação
                        </button>

                    </div>

                </div>

            </form>

        </section>

    </main>


    <script src="dev.js"></script>

</body>

</html>
