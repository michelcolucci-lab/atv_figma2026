<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playmash - Pagamento Pix</title>
  <link rel="stylesheet" href="pagamentostyle.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <header class="header">
    <div class="logo-area">
      <img id="logo" src="img logo.png" alt="Logo Playmash" />
    </div>

    <nav class="menu" id="menu1">
      <button id="cartBtn" class="cart-wrap" type="button" aria-label="Carrinho de compras">
        <img id="cartIcon" src="carrinho.png" alt="Carrinho de compras" />
        <span id="cartBadge" class="badge">!</span>
      </button>

      <button id="perfilBtn" class="perfil-btn" type="button" aria-label="Perfil">
        <img id="perfil" src="Captura_de_tela_2026-09-28_142303-removebg-preview.png" alt="Perfil" />
      </button>
    </nav>
  </header>

  <main class="content-area">
    <div class="modal-card">
      <div class="payment-method-header">
        <h2>Pagamento via PIX</h2>
      </div>

      <div class="pix-qr-box">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=00020126360014BR.GOV.BCB.PIX0136playmash@pix.example5204000053039865802BR5925Playmash6009Sao Paulo62070503***6304ABCD" alt="QR Code PIX" />
      </div>

      <div class="pix-code-container">
        <span class="pix-label">Código PIX</span>
        <div class="input-row pix-row">
          <input type="text" id="pix-code" value="00020126360014BR.GOV.BCB.PIX0136playmash@pix.example5204000053039865802BR5925Playmash6009Sao Paulo62070503***6304ABCD" readonly />
          <button type="button" class="btn-copy" id="btn-copiar-pix">
            <i class="fa-regular fa-copy"></i>
          </button>
        </div>
      </div>

      <div class="total-banner">
        <span>Total:</span>
        <span class="total-price" id="total-display">R$ 0,00</span>
      </div>

      <div class="pix-status">Status: Aguardando Pagamento</div>

      <button type="button" class="btn-submit" id="btn-finalizar-pix">Realizar compra</button>

      <div class="modal-footer">
        <a href="#" class="link-ajuda">ajuda</a>
        <a href="teladepagamento.html" class="link-sair">sair</a>
      </div>
    </div>
  </main>

  <script>
    const total = Number(localStorage.getItem("playmash_total") || 0);

    const totalDisplay = document.getElementById("total-display");
    if (totalDisplay) {
      totalDisplay.textContent = new Intl.NumberFormat("pt-BR", {
        style: "currency",
        currency: "BRL"
      }).format(total);
    }

    document.getElementById("cartBtn").addEventListener("click", () => {
      window.location.href = "carrinho.html";
    });

    document.getElementById("perfilBtn").addEventListener("click", () => {
      window.location.href = "confperfil.html";
    });

    document.getElementById("btn-copiar-pix").addEventListener("click", () => {
      const pixCode = document.getElementById("pix-code");
      pixCode.select();
      navigator.clipboard.writeText(pixCode.value).then(() => {
        alert("Código PIX copiado!");
      }).catch(() => {
        alert("Não foi possível copiar automaticamente.");
      });
    });

    document.getElementById("btn-finalizar-pix").addEventListener("click", () => {
      alert("Compra realizada com PIX!");
      window.location.href = "inicial.html";
    });
  </script>
</body>
</html>
